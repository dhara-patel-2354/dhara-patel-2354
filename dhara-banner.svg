<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Dhara Patel — Android, applied ML, and social impact</title>
  <desc id="desc">A midnight-coloured developer banner with mint, violet, and coral accents. A map inside a phone connects to a small neural-network illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07121a"/><stop offset=".54" stop-color="#0b1020"/><stop offset="1" stop-color="#1b122b"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#73f4cf"/><stop offset=".52" stop-color="#a896ff"/><stop offset="1" stop-color="#ffa89a"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172a36"/><stop offset="1" stop-color="#171b31"/></linearGradient>
    <radialGradient id="mint"><stop stop-color="#64e5c6" stop-opacity=".17"/><stop offset="1" stop-color="#64e5c6" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop stop-color="#ad87ff" stop-opacity=".2"/><stop offset="1" stop-color="#ad87ff" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#c1d0ed" opacity=".13"/></pattern>
    <clipPath id="rounded"><rect width="1200" height="430" rx="24"/></clipPath>
    <clipPath id="screen"><rect x="812" y="87" width="179" height="266" rx="20"/></clipPath>
  </defs>
  <style>
    .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'Courier New',monospace}
    .flow{stroke-dasharray:7 12;animation:flow 8s linear infinite}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-190}}@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.18)}}
    @media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
  </style>
  <g clip-path="url(#rounded)">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <ellipse cx="834" cy="141" rx="320" ry="260" fill="url(#mint)"/>
    <ellipse cx="1110" cy="391" rx="330" ry="300" fill="url(#violet)"/>
    <rect x="640" y="0" width="560" height="430" fill="url(#dots)"/>
    <path d="M680 0v430M752 0v430M0 365h1200" stroke="#91abc8" stroke-opacity=".07"/>
    <path d="M40 40h36M40 40v36M1160 390h-36M1160 390v-36" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".65"/>
    <g class="sans">
      <rect x="64" y="72" width="36" height="4" rx="2" fill="#73f4cf"/>
      <text x="115" y="80" fill="#b2bfd1" font-size="17" letter-spacing="2.7">CODE WITH A PURPOSE</text>
      <text x="62" y="178" fill="#f3f5ff" font-size="76" font-weight="700" letter-spacing="-3.5">Dhara Patel<tspan fill="#73f4cf">.</tspan></text>
      <text x="66" y="224" fill="#c2ccde" font-size="26">Android apps. Applied ML. Real problems.</text>
      <g font-size="15" font-weight="700" letter-spacing="1.4">
        <rect x="66" y="263" width="119" height="34" rx="17" fill="#112b2d" stroke="#2b685c"/><text x="85" y="285" fill="#8af3d7">ANDROID</text>
        <rect x="196" y="263" width="140" height="34" rx="17" fill="#241e3d" stroke="#584777"/><text x="214" y="285" fill="#c9b9ff">APPLIED ML</text>
        <rect x="347" y="263" width="171" height="34" rx="17" fill="#2b202b" stroke="#715056"/><text x="365" y="285" fill="#ffc0b5">SOCIAL IMPACT</text>
      </g>
      <text x="66" y="350" fill="#a0afc5" font-size="18">SFU Computing Science</text>
      <circle cx="291" cy="344" r="2.5" fill="#697c96"/>
      <text x="308" y="350" fill="#a0afc5" font-size="18">Co-founder, TechAlong Labs</text>
    </g>
    <g fill="none" stroke="#6e82a6" stroke-width="1.4" opacity=".32">
      <path d="M720 117h49v86h35M702 315h56v-41h46M994 130h56v-54h79M994 305h34v47h111"/>
      <circle cx="720" cy="117" r="5"/><circle cx="702" cy="315" r="5"/><circle cx="1129" cy="76" r="5"/>
    </g>
    <g>
      <rect x="797" y="64" width="210" height="311" rx="31" fill="#071018" stroke="#677a96" stroke-width="1.8"/>
      <rect x="804" y="71" width="196" height="297" rx="25" fill="url(#glass)" stroke="#23354a"/>
      <rect x="868" y="77" width="66" height="7" rx="3.5" fill="#071018"/>
      <g clip-path="url(#screen)">
        <rect x="812" y="87" width="179" height="266" fill="#111e29"/>
        <path d="M800 161h201M800 248h201M855 90v268M951 90v268" stroke="#243d49" stroke-width="14"/>
        <path d="M800 161h201M800 248h201M855 90v268M951 90v268" stroke="#385265" stroke-width="1" opacity=".6"/>
        <path d="M814 332c40-64 35-64 81-84s22-80 73-118" fill="none" stroke="#a48eff" stroke-opacity=".24" stroke-width="25"/>
        <path d="M814 332c40-64 35-64 81-84s22-80 73-118" fill="none" stroke="#ae97ff" stroke-width="3" class="flow"/>
        <rect x="824" y="99" width="150" height="31" rx="10" fill="#0a1420" stroke="#34465b"/>
        <circle cx="838" cy="114" r="4" fill="#73f4cf"/>
        <text x="850" y="119" class="sans" fill="#dce9ee" font-size="13">A place to begin</text>
        <circle cx="897" cy="247" r="23" fill="#73f4cf" opacity=".1" class="pulse"/>
        <path d="M897 225c-11 0-18 8-18 18 0 14 18 29 18 29s18-15 18-29c0-10-7-18-18-18Z" fill="#73f4cf"/>
        <circle cx="897" cy="242" r="6" fill="#10292b"/>
        <rect x="825" y="307" width="151" height="32" rx="10" fill="#0a1420" stroke="#34465b"/>
        <path d="M837 321h8m-4-4v8" stroke="#b7a3ff" stroke-width="1.5"/>
        <text x="852" y="327" class="sans" fill="#bdcddd" font-size="12">Ideas into interfaces</text>
      </g>
    </g>
    <g stroke="#a497d8" stroke-width="1.5" stroke-opacity=".55" fill="none">
      <path d="M1040 192l47-23 44 24M1040 192l47 24 44-23M1040 244l47-75M1040 244l47-28 44 30M1087 169v47l44 30M1040 192l47 76 44-75M1040 244l47 24 44-22"/>
      <circle cx="1040" cy="192" r="7" fill="#73f4cf" stroke="none"/><circle cx="1040" cy="244" r="7" fill="#73f4cf" stroke="none"/>
      <circle cx="1087" cy="169" r="7" fill="#b9a5ff" stroke="none"/><circle cx="1087" cy="216" r="7" fill="#b9a5ff" stroke="none"/><circle cx="1087" cy="268" r="7" fill="#b9a5ff" stroke="none"/>
      <circle cx="1131" cy="193" r="7" fill="#ffb4a4" stroke="none"/><circle cx="1131" cy="246" r="7" fill="#ffb4a4" stroke="none"/>
    </g>
    <g class="mono" font-size="14"><text x="1030" y="307" fill="#a89ac8">learn → build</text><text x="1030" y="327" fill="#8e9cb4">→ improve</text></g>
    <rect x="65" y="395" width="1070" height="2" rx="1" fill="url(#accent)" opacity=".7"/>
  </g>
</svg>
